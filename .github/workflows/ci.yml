name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push makes an in-progress run pointless; cancel it rather than pay for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the secret scan can see every tracked file.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan for committed credentials
        run: node scripts/scan-secrets.mjs --all

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # The suite is unit tests, but several modules import the validated env
      # singleton, which refuses to load if configuration is missing - so the
      # runner needs a syntactically valid environment even though nothing here
      # connects to anything. The secrets are throwaway values of the right shape,
      # not credentials: there is nothing for them to open.
      #
      # DATABASE_URL points at a port with nothing behind it on purpose. The few
      # tests that would use a database check whether one answers and skip when it
      # does not, so this proves that path works rather than quietly bypassing it.
      - name: Test
        run: npm run test
        env:
          APP_ENV: test
          APP_URL: http://localhost:3000
          BETTER_AUTH_URL: http://localhost:3000
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/ci_no_database
          DISABLE_REDIS: "true"
          BETTER_AUTH_SECRET: ci-only-not-a-real-secret-000000000000
          N8N_WEBHOOK_SECRET: ci-only-not-a-real-secret-000000000000

      # Dependency vulnerabilities in what actually ships.
      #
      # `--omit=dev` and `--audit-level=high` are both deliberate, and both cost
      # something, so they are worth explaining.
      #
      # Code that only ever runs on a developer's machine or in this runner is a
      # different risk from code serving requests: it handles no customer data and
      # is reachable by nobody. `@better-auth/cli` - one script, `auth:schema-check`
      # - currently drags in its own older copy of better-auth plus prisma-ast and
      # lodash, which between them carry a critical and two high advisories. None of
      # those files is in the server bundle, and gating on them would mean either
      # ignoring a permanently red CI or dropping a useful tool.
      #
      # Run `npm audit` with no flags locally to see everything, dev included.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      # Proves the app compiles. No secrets are needed: configuration is
      # validated at server startup in src/instrumentation.ts, not at build time,
      # precisely so that CI does not require production credentials.
      - name: Build
        run: npm run build
