name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push makes an in-progress run pointless; cancel it rather than pay for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # `@/lib/env` validates every required variable the moment it is imported, not
    # lazily - see src/lib/env/index.ts for why. That makes these job-wide, not just
    # the Test step's problem: Next has to import a Route Handler's module during
    # `next build` to read its config (runtime, dynamic, ...), and doing that for
    # /n8n/intake or /lead-images pulls @/lib/env in along the way. Build failed on
    # every push before this route existed too - `next build` was never actually
    # exempt, it just happened not to import anything reaching @/lib/env yet.
    #
    # The values are throwaway strings of the right shape, not credentials - there
    # is nothing for them to open. DATABASE_URL points at a port with nothing behind
    # it on purpose: the few tests that would use a database check whether one
    # answers and skip when it does not, so this proves that path works rather than
    # quietly bypassing it.
    env:
      APP_ENV: test
      APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/ci_no_database
      DISABLE_REDIS: "true"
      BETTER_AUTH_SECRET: ci-only-not-a-real-secret-000000000000
      N8N_WEBHOOK_SECRET: ci-only-not-a-real-secret-000000000000

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the secret scan can see every tracked file.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan for committed credentials
        run: node scripts/scan-secrets.mjs --all

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm run test

      # Dependency vulnerabilities in what actually ships.
      #
      # `--omit=dev` and `--audit-level=high` are both deliberate, and both cost
      # something, so they are worth explaining.
      #
      # Code that only ever runs on a developer's machine or in this runner is a
      # different risk from code serving requests: it handles no customer data and
      # is reachable by nobody. `@better-auth/cli` - one script, `auth:schema-check`
      # - currently drags in its own older copy of better-auth plus prisma-ast and
      # lodash, which between them carry a critical and two high advisories. None of
      # those files is in the server bundle, and gating on them would mean either
      # ignoring a permanently red CI or dropping a useful tool.
      #
      # Run `npm audit` with no flags locally to see everything, dev included.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      # Proves the app compiles.
      - name: Build
        run: npm run build

  # Publishes the production image once Verify has passed, so a broken build
  # or a failing test never reaches GHCR. Only on a push to main, never for a
  # pull request - a fork's PR has no write access to this repo's packages,
  # and there is nothing to deploy from a branch that has not merged yet.
  publish:
    name: Publish to GHCR
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two images out of one Dockerfile - see the file's own comment for why
      # `migrator` is a separate target rather than a partial node_modules copy
      # bolted onto the slim runtime image.
      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest-migrate
            ghcr.io/${{ github.repository }}:${{ github.sha }}-migrate
          cache-from: type=gha
          cache-to: type=gha,mode=max
